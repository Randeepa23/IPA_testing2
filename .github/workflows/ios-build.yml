name: Flutter iOS Build

on:
  push:
    branches:
      - main  # Trigger build on every push to main branch
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # Step 1: Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Setup Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.8"

      # Step 3: Install dependencies
      - name: Install Flutter dependencies
        run: flutter pub get

      # Step 4: Build iOS app (without code signing)
      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      # Step 5: Ensure output directory exists and copy app
      - name: Archive iOS App
        run: |
          mkdir -p output
          if [ -d "build/ios/iphoneos" ]; then
            cp -r build/ios/iphoneos/*.app output/
          else
            echo "iOS build folder not found!"
            exit 1
          fi

      # Step 6: List contents of output (optional debugging)
      - name: List archived files
        run: ls -la output

      # Step 7: Upload artifact to GitHub
      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v3
        with:
          name: ios-build
          path: output/
