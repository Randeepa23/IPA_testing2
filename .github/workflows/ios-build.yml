name: Flutter iOS Build
 
on:
  push:
    branches:
      - main  # build on every push to main branch
 
jobs:
  build-ios:
    runs-on: macos-latest
 
    steps:
    - uses: actions/checkout@v3
 
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: "3.38.8"
 
    - name: Install dependencies
      run: flutter pub get
 
    - name: Build iOS
      run: flutter build ios --release --no-codesign
 
    - name: Archive IPA
      run: |
        mkdir -p output
        cp -r build/ios/iphoneos/*.app output/
