name: Flutter iOS Build

on:
  push:
    branches:
      - main
  workflow_dispatch: # Manual trigger option

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.8"

      # 3. Install dependencies
      - name: Install Flutter dependencies
        run: flutter pub get

      # 4. Build iOS app (no codesign)
      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      # 5. Archive the built app
      - name: Archive iOS App
        run: |
          mkdir -p output
          if [ -d "build/ios/iphoneos" ]; then
            cp -r build/ios/iphoneos/*.app output/
          else
            echo "iOS build folder not found!"
            exit 1
          fi

      # 6. List output (optional)
      - name: List archived files
        run: ls -la output

      # 7. Upload artifact (using v4)
      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: output/
          # 'overwrite' can be added if you want to replace existing artifacts
          # overwrite: true
